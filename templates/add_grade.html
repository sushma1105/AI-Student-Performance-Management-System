<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Grade</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

{% include 'navbar.html' %}
{% include 'flash_messages.html' %}
<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow-lg border-0">

                <div class="card-body p-5">

                    <div class="text-center mb-4">

                        <i class="bi bi-journal-check display-3 text-success"></i>

                        <h1 class="mt-3">
                            Add Grade
                        </h1>

                        <p class="text-muted">
                            Assign subject grades to students
                        </p>

                    </div>

                    <form method="POST">

                        <!-- ROLL NUMBER -->
                        <div class="mb-4">

                            <label class="form-label fw-bold">

                                Roll Number

                            </label>

                            <input
                            type="text"
                            id="roll_number"
                            name="roll_number"
                            class="form-control form-control-lg"
                            placeholder="Enter roll number"
                            required>
                            <div id="student-info" class="mt-3"></div>
                        </div>

                        <!-- SUBJECT -->
                        <div class="mb-4">

                            <label class="form-label fw-bold">

                                Subject

                            </label>

                            <input
                                type="text"
                                name="subject"
                                class="form-control form-control-lg"
                                placeholder="Enter subject"
                                required>

                        </div>
                        <div class="mb-3">

                            <label class="form-label">
                                Semester
                            </label>

                            <select
                                class="form-control"
                                name="semester">

                                <option value="1">Semester 1</option>
                                <option value="2">Semester 2</option>
                                <option value="3">Semester 3</option>
                                <option value="4">Semester 4</option>
                                <option value="5">Semester 5</option>
                                <option value="6">Semester 6</option>
                                <option value="7">Semester 7</option>
                                <option value="8">Semester 8</option>

                            </select>
                        </div>
                        <!-- GRADE -->
                        <div class="mb-4">

                            <label class="form-label fw-bold">

                                Grade

                            </label>

                            <input
                                type="number"
                                name="grade"
                                class="form-control form-control-lg"
                                placeholder="Enter marks"
                                required>

                        </div>

                        <!-- BUTTON -->
                        <button
                            type="submit"
                            class="btn btn-success w-100 py-3">

                            <i class="bi bi-check-circle-fill"></i>

                            Add Grade

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>
<script>
document.getElementById("roll_number").addEventListener("blur", function () {

    const rollNumber = this.value.trim();

    // If textbox is empty
    if (rollNumber === "") {
        document.getElementById("student-info").innerHTML = "";
        return;
    }

    fetch("/get_student/" + rollNumber)
        .then(response => response.json())
        .then(data => {

            const info = document.getElementById("student-info");

            if (data.found) {

                info.innerHTML = `
                    <div class="alert alert-success">
                        <strong>👤 ${data.name}</strong><br>
                        ${data.branch} | Section ${data.section}
                    </div>
                `;

            } else {

                info.innerHTML = `
                    <div class="alert alert-danger">
                        ❌ Student not found
                    </div>
                `;

            }

        });

});
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
